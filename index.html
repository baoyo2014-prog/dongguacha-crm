<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冬瓜茶工廠 — 客戶追蹤系統</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6fa;--card:#fff;--border:#e1e5ee;--text:#1a1d26;--text2:#5a6070;
  --primary:#4f6ef7;--primary-hover:#3b5be0;--primary-light:#eef1fe;
  --success:#22c55e;--success-light:#ecfdf5;--warning:#f59e0b;--warning-light:#fffbeb;
  --danger:#ef4444;--danger-light:#fef2f2;--info:#3b82f6;--info-light:#eff6ff;
  --purple:#8b5cf6;--purple-light:#f5f3ff;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:var(--primary);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:.95rem;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;width:100%;transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.15)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-potential{background:#e5e7eb;color:#374151}
.badge-sent{background:#fef9c3;color:#a16207}
.badge-developed{background:var(--info-light);color:var(--info)}
.badge-inquiry{background:var(--warning-light);color:#d97706}
.badge-closed{background:var(--success-light);color:#16a34a}
.badge-reopen{background:var(--purple-light);color:#7c3aed}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{border:1px solid var(--border);color:var(--text2);background:#fff}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-icon{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text2)}
.btn-icon:hover{background:var(--primary-light);color:var(--primary)}
.btn-icon.danger:hover{background:var(--danger-light);color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.78rem;background:var(--primary-light);color:var(--primary);font-weight:500}
.chip-remove{cursor:pointer;font-size:.9rem;line-height:1}
.header{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px}
.header-actions{display:flex;align-items:center;gap:10px}
.nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--border);padding:0 24px}
.nav-btn{padding:12px 20px;font-size:.9rem;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.dropdown{position:relative}
.dropdown-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:230px;z-index:300;overflow:hidden}
.dropdown-menu.show{display:block}
.dropdown-item{display:block;width:100%;text-align:left;padding:12px 16px;font-size:.9rem;font-weight:600;color:var(--text);transition:background .12s}
.dropdown-item:hover{background:var(--primary-light)}
.dropdown-item .dsub{font-size:.78rem;color:var(--text2);font-weight:400;margin-top:2px}
.dropdown-item.divider{border-top:1px solid var(--border)}
.container{max-width:1200px;margin:0 auto;padding:24px}
.page{display:none}
.page.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat-card .stat-value{font-size:2rem;font-weight:700}
.stat-card .stat-label{font-size:.85rem;color:var(--text2);margin-top:4px}
.stat-card.potential .stat-value{color:var(--text2)}
.stat-card.sent .stat-value{color:#a16207}
.stat-card.developed .stat-value{color:var(--info)}
.stat-card.inquiry .stat-value{color:#d97706}
.stat-card.closed .stat-value{color:#16a34a}
.stat-card.reopen .stat-value{color:#7c3aed}
.stat-card.followup .stat-value{color:var(--danger)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:1rem;font-weight:700}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}.form-row,.form-row-3{grid-template-columns:1fr}}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.filter-bar input[type="search"]{max-width:300px}
.filter-tabs{display:flex;gap:4px}
.filter-tab{padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;color:var(--text2);background:#f0f0f0;transition:all .15s}
.filter-tab:hover{background:#e5e7eb}
.filter-tab.active{background:var(--primary);color:#fff}
.customer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.customer-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s}
.customer-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.customer-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.customer-card h3{font-size:1rem;font-weight:700;margin-bottom:2px}
.customer-card .meta{font-size:.82rem;color:var(--text2)}
.customer-card .meta span{margin-right:12px}
.customer-card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.customer-card .pain{font-size:.82rem;color:var(--danger);margin-top:6px}
.customer-card .followup-flag{font-size:.82rem;color:var(--danger);font-weight:600;margin-top:6px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.modal-header h2{font-size:1.1rem}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.detail-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.detail-tab{padding:10px 18px;font-size:.88rem;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer}
.detail-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.detail-panel{display:none}
.detail-panel.active{display:block}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:16px;padding:12px 16px;background:#f9fafb;border-radius:var(--radius-sm);border:1px solid var(--border)}
.timeline-item::before{content:'';position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff}
.timeline-item .tl-date{font-size:.78rem;color:var(--text2)}
.timeline-item .tl-title{font-weight:600;font-size:.9rem}
.timeline-item .tl-desc{font-size:.85rem;color:var(--text2);margin-top:4px}
.template-list{display:grid;gap:8px}
.template-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.template-item:hover{border-color:var(--primary);background:var(--primary-light)}
.template-item .tpl-name{font-weight:600;font-size:.9rem}
.template-item .tpl-preview{font-size:.8rem;color:var(--text2);margin-top:2px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px}
.empty-state p{margin-bottom:16px}
.search-box{position:relative}
.search-box input{padding-left:36px}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.85rem}
.backup-bar{background:var(--warning-light);border:1px solid #fde68a;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.backup-bar.hidden{display:none}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);min-height:38px;cursor:text}
.tag-input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.tag-input-wrap input{border:none;outline:none;flex:1;min-width:80px;padding:2px;font-size:.9rem}
.tag-input-wrap .chip{font-size:.78rem}
.score-bar{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden;margin-top:4px}
.score-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.priority-high{border-left:3px solid var(--danger)}
.priority-medium{border-left:3px solid var(--warning)}
.priority-low{border-left:3px solid var(--border)}
.followup-overdue{color:var(--danger);font-weight:600}
.followup-soon{color:var(--warning);font-weight:600}
.sentence-actions{display:flex;gap:6px;margin-top:8px}
.print-section{display:none}
@media print{
  body{background:#fff}
  .header,.nav,.filter-bar,.btn,.modal-overlay,.backup-bar,.sentence-actions,.no-print{display:none!important}
  .page{display:block!important}
  .container{max-width:100%;padding:0}
  .customer-card{break-inside:avoid;border:1px solid #ccc}
}
</style>
</head>
<body>

<div class="header">
  <h1>🍵 冬瓜茶工廠 客戶追蹤</h1>
  <div class="header-actions">
    <button class="btn btn-outline btn-sm" onclick="exportData()" title="匯出資料">📤 匯出</button>
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()" title="匯入資料">📥 匯入</button>
    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importData(event)">
    <div class="dropdown">
      <button class="btn btn-outline btn-sm" id="cloudBtn" onclick="toggleCloudDropdown(event)" title="雲端同步 (Google Sheets)" style="opacity:.5">☁️ <span id="cloudStatus">雲同步已停用</span> ▾</button>
      <div class="dropdown-menu" id="cloudDropdown">
        <button class="dropdown-item" onclick="doManualSync()">🔄 立即同步（拉取＋推送）
          <div class="dsub">從雲端抓最新，並上傳本機變更</div></button>
        <button class="dropdown-item" onclick="doManualPull()">⬇️ 只拉取
          <div class="dsub">用雲端資料覆蓋本機</div></button>
        <button class="dropdown-item" onclick="doManualPush()">⬆️ 只推送
          <div class="dsub">把本機資料上傳雲端</div></button>
        <button class="dropdown-item divider" onclick="alert('將 `GAS_URL` 填入 index.html 的`網頁應用程式網址`即可啟用。詳見 GOOGLE_SYNC_設定指南.md')">📖 如何設定雲同步</button>
      </div>
    </div>
    <div class="dropdown">
      <button class="btn btn-primary btn-sm" onclick="toggleAddDropdown(event)">＋ 新增客戶 ▾</button>
      <div class="dropdown-menu" id="addDropdown">
        <button class="dropdown-item" onclick="openCustomerModal()">＋ 新增客戶
          <div class="dsub">僅建立客戶資料</div></button>
        <button class="dropdown-item" onclick="openCustomerModalWithOutreach()">📨 新增客戶並寄開發信
          <div class="dsub">自動記錄日期＋一個月後追蹤</div></button>
      </div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="switchPage('dashboard',this)">📊 儀表板</button>
  <button class="nav-btn" onclick="switchPage('customers',this)">👥 客戶管理</button>
  <button class="nav-btn" onclick="switchPage('followups',this)">📬 跟進中心</button>
  <button class="nav-btn" onclick="switchPage('templates',this)">📝 信件模板</button>
  <button class="nav-btn" onclick="switchPage('quotes',this)">💰 報價紀錄</button>
</div>

<div id="backupBar" class="backup-bar hidden">
  <span>⚠️ 資料僅儲存於本機瀏覽器，建議定期匯出 CSV 備份（每週提醒一次，達 50 筆客戶時固定提醒）</span>
  <div>
    <button class="btn btn-sm btn-outline" onclick="exportData()">立即匯出</button>
    <button class="btn btn-sm btn-outline" onclick="dismissBackup()" style="margin-left:6px">知道了</button>
  </div>
</div>

<div class="container">

  <!-- ========== 儀表板 ========== -->
  <div id="page-dashboard" class="page active">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="charts-grid">
      <div class="card">
        <div class="card-header"><span class="card-title">客戶狀態分布</span></div>
        <div id="statusChart" style="display:flex;align-items:center;justify-content:center;min-height:200px"></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">產業分布</span></div>
        <div id="industryChart" style="min-height:200px"></div>
      </div>
    </div>
    <div class="charts-grid">
      <div class="card">
        <div class="card-header"><span class="card-title">客戶建立月份趨勢</span></div>
        <div id="trendChart" style="min-height:200px"></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">📈 開發信轉化率</span></div>
        <div id="conversionChart" style="min-height:200px"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><span class="card-title">📬 開發信待追蹤（寄送逾一個月）</span></div>
      <div id="outreachDueList"></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><span class="card-title">⏰ 逾期未跟進</span></div>
      <div id="overdueList"></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">📅 本週待跟進</span></div>
      <div id="upcomingList"></div>
    </div>
  </div>

  <!-- ========== 客戶管理 ========== -->
  <div id="page-customers" class="page">
    <div class="filter-bar">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="搜尋公司名、聯絡人..." oninput="filterCustomers()">
      </div>
      <div class="filter-tabs" id="statusTabs">
        <button class="filter-tab active" data-status="all" onclick="setStatusFilter('all',this)">全部</button>
        <button class="filter-tab" data-status="潛在客戶" onclick="setStatusFilter('潛在客戶',this)">潛在客戶</button>
        <button class="filter-tab" data-status="已寄開發信" onclick="setStatusFilter('已寄開發信',this)">已寄開發信</button>
        <button class="filter-tab" data-status="已開發" onclick="setStatusFilter('已開發',this)">已開發</button>
        <button class="filter-tab" data-status="已詢價" onclick="setStatusFilter('已詢價',this)">已詢價</button>
        <button class="filter-tab" data-status="可再開發名單" onclick="setStatusFilter('可再開發名單',this)">可再開發名單</button>
        <button class="filter-tab" data-status="已成交" onclick="setStatusFilter('已成交',this)">已成交</button>
      </div>
      <select id="sortSelect" onchange="filterCustomers()" style="width:auto;max-width:160px">
        <option value="updatedAt">最近更新</option>
        <option value="createdAt">建立日期</option>
        <option value="score">優先順序</option>
        <option value="companyName">公司名稱</option>
      </select>
    </div>
    <div id="customerGrid" class="customer-grid"></div>
    <div id="customerEmpty" class="empty-state" style="display:none">
      <div class="empty-icon">🏢</div>
      <p>尚未建立任何客戶資料</p>
      <div class="dropdown" style="display:inline-block">
        <button class="btn btn-primary" onclick="toggleAddDropdown(event)">＋ 新增第一個客戶 ▾</button>
        <div class="dropdown-menu" id="addDropdownEmpty">
          <button class="dropdown-item" onclick="openCustomerModal()">＋ 新增客戶
            <div class="dsub">僅建立客戶資料</div></button>
          <button class="dropdown-item" onclick="openCustomerModalWithOutreach()">📨 新增客戶並寄開發信
            <div class="dsub">自動記錄日期＋一個月後追蹤</div></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 跟進中心 ========== -->
  <div id="page-followups" class="page">
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <span class="card-title">🔥 高意願跟進</span>
        <span id="highCount" class="badge badge-inquiry"></span>
      </div>
      <div id="highIntentList"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">💬 純詢價跟進</span>
        <span id="pureCount" class="badge badge-potential"></span>
      </div>
      <div id="pureQuoteList"></div>
    </div>
  </div>

  <!-- ========== 信件模板 ========== -->
  <div id="page-templates" class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:1.1rem">跟進信件模板庫</h2>
      <button class="btn btn-primary btn-sm" onclick="openTemplateModal()">＋ 新增模板</button>
    </div>
    <div id="templateList" class="template-list"></div>
  </div>

  <!-- ========== 報價紀錄 ========== -->
  <div id="page-quotes" class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:1.1rem">報價歷史紀錄</h2>
      <button class="btn btn-primary btn-sm" onclick="openQuoteModal()">＋ 新增報價</button>
    </div>
    <div id="quoteList"></div>
  </div>
</div>

<!-- ========== 客戶 Modal ========== -->
<div class="modal-overlay" id="customerModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="customerModalTitle">新增客戶</h2>
      <button class="btn-icon" onclick="closeModal('customerModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editCustomerId">

      <label>基本資料</label>
      <div class="form-group"><label>建立日期（自動紀錄）</label><input id="f_createdDate" type="date" disabled readonly></div>
      <div class="form-row">
        <div class="form-group"><label>公司名稱</label><input id="f_companyName" placeholder="公司登記名稱"></div>
        <div class="form-group"><label>品牌名稱</label><input id="f_brand" placeholder="與公司名稱不同時填寫"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>聯絡人</label><input id="f_contactPerson"></div>
        <div class="form-group"><label>Email</label><input id="f_email" type="email"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>電話</label><input id="f_phone"></div>
        <div class="form-group"><label>地址</label><input id="f_address" placeholder="配送地址"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>產業別</label>
          <select id="f_industry">
            <option value="">-- 選擇 --</option>
            <option>連鎖餐飲</option><option>連鎖飲料</option><option>南北雜貨</option>
            <option>個別店家</option><option>個人</option>
          </select>
        </div>
        <div class="form-group"><label>客戶來源</label>
          <select id="f_source">
            <option value="">-- 選擇 --</option>
            <option>展會</option><option>冷開發信</option><option>轉介紹</option>

<script>
// ==================== DATA LAYER ====================
const STORAGE_KEY = 'b2b_crm_data';
const BACKUP_KEY = 'b2b_crm_backup_dismissed';

// ===== Google Sheets 雲同步設定 =====
// 填入你部署 Apps Script 後得到的「網頁應用程式網址」即可啟用雲端同步。
// 詳見 GOOGLE_SYNC_設定指南.md。留空 = 停用雲端同步（純本機單機使用）。
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyAhohBMQh0w4IbkNKOvkcwoKoTQwexjoR6r7cwCrLV1IPoFRuafCcBiz5HulyHil_g/exec';

function getDefaultData() {
  return { version: 1, lastUpdated: new Date().toISOString(), customers: [], templates: getDefaultTemplates(), quotes: [] };
}

function getDefaultTemplates() {
  return [
    { id: 'tpl_1', name: '初次開發信', scene: '初次開發', subject: '冬瓜茶工廠 — 合作洽詢', content: '您好 {聯絡人}：\n\n我是冬瓜茶工廠的 [您的姓名]，我們專業生產傳統冬瓜茶、冬瓜磚、冬瓜露等系列产品。\n\n了解到貴司在飲品/餐飲方面有相關需求，我們的產品可以為您的菜單增添獨特的古早味選擇。\n\n歡迎索取樣品試飲，期待有合作機會！\n\n順祝商祺\n冬瓜茶工廠 [您的姓名]' },
    { id: 'tpl_2', name: '詢價回覆', scene: '詢價回覆', subject: 'Re: {公司名} 詢價回覆', content: '{聯絡人} 您好：\n\n感謝您的詢價，以下是報價資訊：\n\n[產品]: [單價]\n最低訂購量: [MOQ]\n交期: [交期]\n付款條件: [條件]\n\n如需索取樣品試飲，歡迎隨時告知。\n\n冬瓜茶工廠 [您的姓名]' },
    { id: 'tpl_3', name: '催單跟進', scene: '催單跟進', subject: 'Re: {公司名} 進度跟進', content: '{聯絡人} 您好：\n\n之前寄送的資料不曉得您有機會過目了嗎？\n\n想關心一下冬瓜茶合作的進度，不曉得是否有需要調整的地方？\n\n也歡迎先索取樣品試試看風味！\n\n冬瓜茶工廠 [您的姓名]' },
    { id: 'tpl_4', name: '樣品寄送通知', scene: '樣品寄送', subject: '冬瓜茶样品已寄出 — {公司名}', content: '{聯絡人} 您好：\n\n您索取的冬瓜茶樣品已寄出，預計 [天數] 天內送達。\n\n包含品項：[品項列表]\n\n試飲後歡迎提供回饋，我們可以根據您的需求調整配方或規格。\n\n冬瓜茶工廠 [您的姓名]' },
    { id: 'tpl_5', name: '節日問候', scene: '節日問候', text: '節日問候', subject: '冬瓜茶工廠 — 節日問候', content: '{聯絡人} 您好：\n\n值此佳節，冬瓜茶工廠全體同仁祝您 [節日名稱] 快樂！\n\n感謝貴司一直以來的支持與合作，期待新的一年繼續為您提供優質的冬瓜茶產品。\n\n冬瓜茶工廠 敬上' },
  ];
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return getDefaultData();
    const data = JSON.parse(raw);
    if (!data.customers) data.customers = [];
    if (!data.templates) data.templates = getDefaultTemplates();
    if (!data.quotes) data.quotes = [];
    return data;
  } catch { return getDefaultData(); }
}

function saveData(data) {
  data.lastUpdated = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  scheduleCloudPush(data);
}

function uuid() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
function today() { return new Date().toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.floor((new Date(b) - new Date(a)) / 86400000); }

// ==================== GOOGLE SHEETS 雲同步 ====================
let cloudStatus = 'local'; // local | syncing | ok | error
let pushTimer = null;

function cloudEnabled() { return GAS_URL && GAS_URL.trim() !== ''; }

function updateCloudUI(status, msg) {
  cloudStatus = status;
  const el = document.getElementById('cloudStatus');
  if (!el) return;
  const texts = {
    local: cloudEnabled() ? '雲端未連線' : '雲同步已停用',
    syncing: '同步中…',
    ok: '☁️ 已同步',
    error: '⚠️ ' + (msg || '同步失敗'),
    pulled: '☁️ 已拉取'
  };
  const colors = { local:'#5a6070', syncing:'#f59e0b', ok:'#22c55e', error:'#ef4444', pulled:'#22c55e' };
  el.textContent = texts[status] || '';
  el.style.color = colors[status] || '#5a6070';
  const btn = document.getElementById('cloudBtn');
  if (btn) btn.style.opacity = cloudEnabled() ? '1' : '.5';
}

// 延遲合併推送（避免連續儲存觸發過多次 API）
function scheduleCloudPush(data) {
  if (!cloudEnabled()) return;
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushToCloud(data), 800);
}

// 推送本機資料到 Google Sheets
async function pushToCloud(data) {
  if (!cloudEnabled()) return updateCloudUI('local');
  updateCloudUI('syncing');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data || appData)
    });
    // no-cors 無法讀取回應，只能假設成功
    updateCloudUI('ok');
  } catch (e) {
    updateCloudUI('error', '無法連線雲端');
  }
}

// 從 Google Sheets 拉取資料
async function pullFromCloud() {
  if (!cloudEnabled()) { updateCloudUI('local'); return { ok:false, error:'cloud disabled' }; }
  updateCloudUI('syncing');
  try {
    const res = await fetch(GAS_URL + '?action=read');
    const result = await res.json();
    if (!result.ok) { updateCloudUI('error', result.error || '拉取失敗'); return result; }
    return result;
  } catch (e) {
    updateCloudUI('error', '無法連線雲端');
    return { ok:false, error: String(e) };
  }
}

// 完整同步流程：拉取雲端，若比本機新則採用雲端
async function syncFromCloud() {
  if (!cloudEnabled()) { updateCloudUI('local'); return; }
  const result = await pullFromCloud();
  if (!result.ok || !result.data) return;
  const cloudData = result.data;
  const localLast = new Date((appData.lastUpdated || 0));
  const cloudLast = new Date((cloudData.lastUpdated || 0));
  if (cloudData.customers.length && cloudLast >= localLast) {
    appData = cloudData;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    refreshAll();
    updateCloudUI('pulled');
  } else if (cloudData.customers.length && localLast > cloudLast) {
    // 本機較新，推回雲端
    pushToCloud(appData);
    updateCloudUI('ok');
  } else if (!cloudData.customers.length && appData.customers.length) {
    // 雲端空白，本機有資料則推送建立
    pushToCloud(appData);
    updateCloudUI('ok');
  } else {
    updateCloudUI('ok');
  }
}

function refreshAll() {
  filterCustomers();
  renderDashboard();
  renderTemplates();
  renderQuotes();
  renderFollowups();
}

function toggleCloudDropdown(e) {
  e.stopPropagation();
  const menu = document.getElementById('cloudDropdown');
  closeAddDropdowns();
  if (menu) menu.classList.toggle('show');
}

function doManualSync() {
  closeAddDropdowns();
  updateCloudUI('syncing');
  syncFromCloud();
}

function doManualPull() {
  closeAddDropdowns();
  pullFromCloud().then(result => {
    if (result.ok && result.data) {
      appData = result.data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      refreshAll();
      updateCloudUI('pulled');
    }
  });
}

function doManualPush() {
  closeAddDropdowns();
  pushToCloud(appData);
}

// ==================== STATE ====================
let appData = loadData();
let currentStatusFilter = 'all';
let currentDetailId = null;

// ==================== NAVIGATION ====================
function switchPage(id, btn) {

  document.getElementById('page-' + id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (id === 'customers') filterCustomers();
  if (id === 'followups') renderFollowups();

}

function openModal(id) { document.getElementById(id).classList.add('show'); }

// ==================== TAG INPUT ====================
function handleTagInput(e, wrapId, hiddenId) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const input = e.target;
    const val = input.value.trim();
    if (!val) return;
    const hidden = document.getElementById(hiddenId);
    let arr = hidden.value ? hidden.value.split(',').filter(Boolean) : [];
    if (arr.includes(val)) { input.value = ''; return; }
    arr.push(val);
    hidden.value = arr.join(',');
    renderTags(wrapId, hiddenId);
    input.value = '';
  }
}

function renderTags(wrapId, hiddenId) {
  const wrap = document.getElementById(wrapId);
  const hidden = document.getElementById(hiddenId);
  const arr = hidden.value ? hidden.value.split(',').filter(Boolean) : [];
  wrap.querySelectorAll('.chip').forEach(c => c.remove());
  const input = wrap.querySelector('input');
  arr.forEach((tag, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = tag + ' <span class="chip-remove" onclick="removeTag(' + i + ',\'' + hiddenId + '\',\'' + wrapId + '\')">&times;</span>';
    wrap.insertBefore(chip, input);
  });
}

function removeTag(i, hiddenId, wrapId) {
  const hidden = document.getElementById(hiddenId);
  let arr = hidden.value.split(',').filter(Boolean);
  arr.splice(i, 1);
  hidden.value = arr.join(',');
  renderTags(wrapId, hiddenId);
}

// ==================== CUSTOMER CRUD ====================
let newCustomerOutreachMode = false;

function closeAddDropdowns() {
  document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
}

function toggleAddDropdown(e) {
  e.stopPropagation();
  const menu = e.currentTarget.nextElementSibling;
  closeAddDropdowns();
  if (menu && menu.classList.contains('dropdown-menu')) menu.classList.toggle('show');
}

function openCustomerModalWithOutreach() {
  newCustomerOutreachMode = true;
  openCustomerModal();
}

function openCustomerModal(id) {
  document.getElementById('editCustomerId').value = '';
  const isOutreachNew = !id && newCustomerOutreachMode;
  document.getElementById('customerModalTitle').textContent = isOutreachNew ? '新增客戶並寄開發信' : '新增客戶';
  ['f_brand','f_companyName','f_contactPerson','f_email','f_phone','f_address','f_industry','f_source','f_status','f_priority',
   'f_moq','f_pricingSensitivity','f_budgetRange','f_deliveryTimeline','f_orderCycle','f_notes',
   'f_dmName','f_dmTitle','f_dmInfluence','f_outreachDate','f_outreachNext'].forEach(f => {
    const el = document.getElementById(f);
    if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  ['f_products','f_certs','f_painPoints'].forEach(f => document.getElementById(f).value = '');
  ['f_products_wrap','f_certs_wrap','f_painPoints_wrap'].forEach(w => {
    document.getElementById(w).querySelectorAll('.chip').forEach(c => c.remove());
  });
  document.getElementById('f_priority').value = '2';
  document.getElementById('f_createdDate').value = today();

  if (isOutreachNew) {
    const d = new Date(); d.setDate(d.getDate() + 30);
    document.getElementById('f_status').value = '已寄開發信';
    document.getElementById('f_outreachDate').value = today();
    document.getElementById('f_outreachNext').value = d.toISOString().slice(0, 10);
  }

  if (id) {
    const c = appData.customers.find(x => x.id === id);
    if (c) {
      document.getElementById('editCustomerId').value = c.id;
      document.getElementById('customerModalTitle').textContent = '編輯客戶';
      document.getElementById('f_companyName').value = c.companyName || '';
      document.getElementById('f_brand').value = c.brand || '';
      document.getElementById('f_contactPerson').value = c.contactPerson || '';
      document.getElementById('f_email').value = c.email || '';
      document.getElementById('f_phone').value = c.phone || '';
      document.getElementById('f_address').value = c.address || '';
      document.getElementById('f_createdDate').value = c.createdAt ? c.createdAt.slice(0, 10) : today();
      document.getElementById('f_industry').value = c.industry || '';
      document.getElementById('f_source').value = c.source || '';
      document.getElementById('f_status').value = c.status || '潛在客戶';
      document.getElementById('f_outreachDate').value = c.outreachDate || '';
      document.getElementById('f_outreachNext').value = c.outreachNext || '';
      document.getElementById('f_priority').value = c.priority || '2';
      document.getElementById('f_moq').value = c.moq || '';
      document.getElementById('f_pricingSensitivity').value = c.pricingSensitivity || '';
      document.getElementById('f_budgetRange').value = c.budgetRange || '';
      document.getElementById('f_deliveryTimeline').value = c.deliveryTimeline || '';
      document.getElementById('f_orderCycle').value = c.orderCycle || '';
      document.getElementById('f_notes').value = c.notes || '';
      document.getElementById('f_dmName').value = c.decisionMaker?.name || '';
      document.getElementById('f_dmTitle').value = c.decisionMaker?.title || '';
      document.getElementById('f_dmInfluence').value = c.decisionMaker?.influence || '';
      const setTag = (field, wrap, val) => {
        document.getElementById(field).value = (val || []).join(',');
        renderTags(wrap, field);
      };
      setTag('f_products', 'f_products_wrap', c.productsOfInterest);
      setTag('f_certs', 'f_certs_wrap', c.certifications);
      setTag('f_painPoints', 'f_painPoints_wrap', c.painPoints);
    }
  }
  openModal('customerModal');
}

function saveCustomer() {
  const companyName = document.getElementById('f_companyName').value.trim();
  const brand = document.getElementById('f_brand').value.trim();
  const contactPerson = document.getElementById('f_contactPerson').value.trim();
  const email = document.getElementById('f_email').value.trim();

  const getTags = (id) => document.getElementById(id).value.split(',').filter(Boolean);
  const editId = document.getElementById('editCustomerId').value;
  const now = new Date().toISOString();
  const newStatus = document.getElementById('f_status').value;
  const lstNewMonth = new Date(); lstNewMonth.setDate(lstNewMonth.getDate() + 30);
  const defaultNext = lstNewMonth.toISOString().slice(0, 10);

  let outreachDate = document.getElementById('f_outreachDate').value || '';
  let outreachNext = document.getElementById('f_outreachNext').value || '';
  if (newStatus === '已寄開發信') {
    if (!outreachDate) outreachDate = today();
    if (!outreachNext) outreachNext = defaultNext;
  }

  if (editId) {
    const c = appData.customers.find(x => x.id === editId);
    if (c && c.status !== newStatus) {
      if (!c.statusHistory) c.statusHistory = [];
      c.statusHistory.push({ from: c.status, to: newStatus, at: today(), note: '' });
    }
    Object.assign(c, {
      companyName, brand: document.getElementById('f_brand').value.trim(), contactPerson, email,
      phone: document.getElementById('f_phone').value.trim(),
      address: document.getElementById('f_address').value.trim(),
      industry: document.getElementById('f_industry').value,
      source: document.getElementById('f_source').value,
      status: newStatus,
      outreachDate,
      outreachNext,
      priority: document.getElementById('f_priority').value,
      productsOfInterest: getTags('f_products'),
      moq: document.getElementById('f_moq').value.trim(),
      pricingSensitivity: document.getElementById('f_pricingSensitivity').value,
      budgetRange: document.getElementById('f_budgetRange').value.trim(),
      certifications: getTags('f_certs'),
      deliveryTimeline: document.getElementById('f_deliveryTimeline').value.trim(),
      painPoints: getTags('f_painPoints'),
      orderCycle: document.getElementById('f_orderCycle').value.trim(),
      decisionMaker: {
        name: document.getElementById('f_dmName').value.trim(),
        title: document.getElementById('f_dmTitle').value.trim(),
        influence: document.getElementById('f_dmInfluence').value
      },
      notes: document.getElementById('f_notes').value.trim(),
      updatedAt: now,
    });
  } else {
    appData.customers.push({
      id: uuid(), companyName, brand: document.getElementById('f_brand').value.trim(), contactPerson, email,
      phone: document.getElementById('f_phone').value.trim(),
      address: document.getElementById('f_address').value.trim(),
      industry: document.getElementById('f_industry').value,
      source: document.getElementById('f_source').value,
      status: newStatus,
      outreachDate,
      outreachNext,
      priority: document.getElementById('f_priority').value,
      productsOfInterest: getTags('f_products'),
      moq: document.getElementById('f_moq').value.trim(),
      pricingSensitivity: document.getElementById('f_pricingSensitivity').value,
      budgetRange: document.getElementById('f_budgetRange').value.trim(),
      certifications: getTags('f_certs'),
      deliveryTimeline: document.getElementById('f_deliveryTimeline').value.trim(),
      painPoints: getTags('f_painPoints'),
      orderCycle: document.getElementById('f_orderCycle').value.trim(),
      decisionMaker: {
        name: document.getElementById('f_dmName').value.trim(),
        title: document.getElementById('f_dmTitle').value.trim(),
        influence: document.getElementById('f_dmInfluence').value
      },
      notes: document.getElementById('f_notes').value.trim(),
      statusHistory: [{ from: '新建立', to: newStatus, at: today(), note: '' }],
      communications: [],
      samples: [],
      competitors: [],
      score: calcScore(document.getElementById('f_priority').value),
      createdAt: now, updatedAt: now,
    });
  }
  saveData(appData);
  newCustomerOutreachMode = false;
  closeModal('customerModal');
  filterCustomers();
  checkBackupReminder();
}

function calcScore(priority) {
  return parseInt(priority) === 1 ? 90 : parseInt(priority) === 2 ? 60 : 30;
}

function deleteCustomer(id) {
  if (!confirm('確定刪除此客戶？此操作無法復原。')) return;
  appData.customers = appData.customers.filter(c => c.id !== id);
  appData.quotes = appData.quotes.filter(q => q.customerId !== id);
  saveData(appData);
  closeModal('detailModal');
  filterCustomers();
}

// ==================== CUSTOMER LIST ====================
function setStatusFilter(status, btn) {
  currentStatusFilter = status;
  document.querySelectorAll('#statusTabs .filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCustomers();
}

function filterCustomers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = appData.customers.filter(c => {
    if (currentStatusFilter !== 'all' && c.status !== currentStatusFilter) return false;
    if (q && !c.companyName.toLowerCase().includes(q) && !(c.brand||'').toLowerCase().includes(q) && !c.contactPerson.toLowerCase().includes(q) && !(c.email||'').toLowerCase().includes(q)) return false;
    return true;
  });
  const sort = document.getElementById('sortSelect').value;
  list.sort((a, b) => {
    if (sort === 'score') return (b.score || 0) - (a.score || 0);
    if (sort === 'companyName') return (a.companyName || '').localeCompare(b.companyName || '');
    return new Date(b[sort] || 0) - new Date(a[sort] || 0);
  });
  renderCustomerGrid(list);
}

function renderCustomerGrid(list) {
  const grid = document.getElementById('customerGrid');
  const empty = document.getElementById('customerEmpty');
  if (!list.length) { grid.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  grid.innerHTML = list.map(c => {
    const badgeClass = { '潛在客戶':'potential','已寄開發信':'sent','已開發':'developed','已詢價':'inquiry','可再開發名單':'reopen','已成交':'closed' }[c.status] || 'potential';
    const priorityClass = c.priority === '1' ? 'priority-high' : c.priority === '3' ? 'priority-low' : '';
    const hasOverdue = hasOverdueFollowup(c);
    const outreachOverdue = c.status === '已寄開發信' && c.outreachNext && c.outreachNext <= today();
    const products = (c.productsOfInterest || []).slice(0, 3).map(p => '<span class="chip">' + p + '</span>').join('');
    const pains = (c.painPoints || []).slice(0, 2).map(p => '⚠ ' + p).join('、');
    const outreachInfo = (c.outreachDate || c.outreachNext) ? '<div class="meta" style="font-size:.78rem;color:var(--text2)">✉️ 寄送 ' + (c.outreachDate||'—') + (c.outreachNext ? ' · 追蹤 ' + c.outreachNext : '') + '</div>' : '';
const outreachFlag = outreachOverdue ? '<div class="followup-flag">⏰ 開發信已逾一個月，請追蹤</div>' : '';
    const showCompany = c.brand && c.companyName && c.brand !== c.companyName;
    return      '<div class="customer-card ' + priorityClass + '" onclick="openDetail(\'' + c.id + '\')">' +
      '<div class="customer-card-header"><h3>' + esc(displayName(c)) + '</h3>' +
      (showCompany ? '<span style="font-size:.75rem;color:var(--text2)">🏢 ' + esc(c.companyName) + '</span>' : '') +
      '<span style="display:flex;align-items:center;gap:6px"><span class="badge badge-' + badgeClass + '">' + c.status + '</span><button class="btn-icon btn-sm" onclick="event.stopPropagation();openCustomerModal(\'' + c.id + '\')" title="編輯">✏️</button></span></div>' +
      '<div class="meta"><span>👤 ' + esc(c.contactPerson) + '</span><span>📧 ' + esc(c.email) + '</span></div>' +
      '<div class="meta"><span>🏭 ' + esc(c.industry || '未分類') + '</span><span>📅 建立 ' + esc((c.createdAt || '').slice(0, 10)) + '</span></div>' +
      (outreachInfo || '') +
      (products ? '<div class="tags">' + products + '</div>' : '') +
      (pains ? '<div class="pain">' + pains + '</div>' : '') +
      (hasOverdue ? '<div class="followup-flag">⏰ 有待跟進項目已逾期</div>' : '') +
      (outreachFlag || '') +
      '</div>';
  }).join('');
}

function hasOverdueFollowup(c) {
  return (c.communications || []).some(cm => cm.needFollowup && cm.nextFollowUpDate && cm.nextFollowUpDate <= today());
}

function openDetail(id) {
  currentDetailId = id;
  const c = appData.customers.find(x => x.id === id);
  if (!c) return;
  document.getElementById('detailTitle').textContent = displayName(c);
  document.getElementById('detailFooter').innerHTML =
    '<button class="btn btn-outline" onclick="openCustomerModal(\'' + id + '\')">✏️ 編輯</button>' +
    '<button class="btn btn-outline" onclick="window.print()">🖨️ 列印</button>' +
    '<button class="btn btn-danger" onclick="deleteCustomer(\'' + id + '\')">🗑️ 刪除</button>';
  switchDetailTab('basic', document.querySelector('.detail-tab'));
}

function useTemplate(id) {
  const t = appData.templates.find(x => x.id === id);
  if (!t) return;
  const subject = t.subject || '';
  const content = t.content || '';
  navigator.clipboard.writeText('主旨: ' + subject + '\n\n' + content).then(() => alert('已複製到剪貼簿！')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = '主旨: ' + subject + '\n\n' + content;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已複製到剪貼簿！');
  });
}

function addQuoteItem(spec, unit, unitPrice, qty, kg) {
  const wrap = document.getElementById('quoteItems');
  const row = document.createElement('div');
  row.className = 'quote-item-row';
  row.style.cssText = 'border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px';
  row.innerHTML =
    '<div style="display:grid;grid-template-columns:1fr 70px 100px 100px 80px 32px;gap:8px;align-items:center;margin-bottom:8px">' +
    '<input class="qi-spec" placeholder="規格名稱（如：500g 冬瓜磚）" value="' + esc(spec || '') + '">' +
    '<select class="qi-unit"><option value="箱">箱</option><option value="顆" ' + (unit === '顆' ? 'selected' : '') + '>顆</option></select>' +
    '<input class="qi-kg" inputmode="decimal" placeholder="每箱公斤" value="' + esc(kg || '') + '">' +
    '<input class="qi-price" inputmode="decimal" placeholder="單價" value="' + esc(unitPrice || '') + '">' +
    '<input class="qi-qty" inputmode="decimal" placeholder="數量" value="' + esc(qty || '') + '">' +
    '<button class="btn-icon danger" onclick="removeQuoteItem(this)" title="刪除此列">✕</button>' +
    '</div>' +
    '<div style="display:flex;justify-content:flex-end;gap:20px;font-size:.82rem;color:var(--text2)">' +
    '<span>每公斤：<strong class="qi-perkg" style="color:var(--text)">—</strong></span>' +
    '<span>小計：<strong class="qi-subtotal" style="color:var(--text)">—</strong></span></div>';
  row.addEventListener('input', recalcQuoteTotal);
  row.addEventListener('change', recalcQuoteTotal);
  wrap.appendChild(row);
  recalcQuoteTotal();
}

function removeQuoteItem(btn) {
  const wrap = document.getElementById('quoteItems');
  const row = btn.closest('.quote-item-row');
  if (wrap.children.length <= 1) {
    row.querySelector('.qi-spec').value = '';
    row.querySelector('.qi-unit').value = '箱';
    row.querySelector('.qi-kg').value = '';
    row.querySelector('.qi-price').value = '';
    row.querySelector('.qi-qty').value = '';
  } else {
    row.remove();
  }
  recalcQuoteTotal();
}

function recalcQuoteTotal() {
  const rows = document.querySelectorAll('#quoteItems .quote-item-row');
  let total = 0;
  rows.forEach(r => {
    const p = parseFloat(r.querySelector('.qi-price').value);
    const q = parseFloat(r.querySelector('.qi-qty').value);
    const kg = parseFloat(r.querySelector('.qi-kg').value);
    const unit = r.querySelector('.qi-unit').value;
    const hasSpec = r.querySelector('.qi-spec').value.trim();
    const isComplete = hasSpec && isFinite(p) && isFinite(q);
    const sub = isComplete ? p * q : NaN;
    r.querySelector('.qi-subtotal').textContent = isFinite(sub) ? String(sub) : '—';
    let perkg = null;
    if (isComplete && unit === '箱' && isFinite(kg) && kg > 0) perkg = p / kg;
    r.querySelector('.qi-perkg').textContent = perkg !== null ? perkg.toFixed(2) : '—';
    if (isFinite(sub)) total += sub;
  });
  document.getElementById('quoteTotal').value = total ? String(total) : '';
}

  const sel = document.getElementById('quoteCustomer');
  sel.innerHTML = appData.customers.map(c => '<option value="' + c.id + '">' + esc(displayName(c)) + '</option>').join('');

function saveQuote() {
  const customerId = document.getElementById('quoteCustomer').value;
  const needsFollowup = document.getElementById('quoteNeedsFollowup').checked;
  const date = document.getElementById('quoteDate').value;
  const cus = appData.customers.find(x => x.id === customerId);
  if (cus) cus.quoteType = needsFollowup ? 'high' : 'pure';
  const rows = Array.from(document.querySelectorAll('#quoteItems .quote-item-row'));
  const items = rows.map(r => ({
    spec: r.querySelector('.qi-spec').value.trim(),
    unit: r.querySelector('.qi-unit').value,
    kgPerBox: r.querySelector('.qi-kg').value.trim(),
    unitPrice: r.querySelector('.qi-price').value.trim(),
    qty: r.querySelector('.qi-qty').value.trim(),
  })).filter(it => it.spec);
  let total = 0;
  items.forEach(it => { const n = parseFloat(it.unitPrice) * parseFloat(it.qty); if (isFinite(n)) total += n; });
  appData.quotes.push({
    id: uuid(), customerId, date,
    product: items.map(it => it.spec).join(' / '),
    unitPrice: items[0].unitPrice,
    qty: items.map(it => it.qty).join(' + '),
    total: total ? String(total) : '',
    taxIncluded: document.getElementById('quoteTaxIncluded').checked,
    shippingIncluded: document.getElementById('quoteShippingIncluded').checked,
    notes: document.getElementById('quoteNotes').value.trim(),
    needsFollowup,
    items,
    createdAt: new Date().toISOString(),
  });

      (q.notes ? '<div style="font-size:.82rem;color:var(--text2);margin-top:6px">備註：' + esc(q.notes) + '</div>' : '') +

// ==================== DASHBOARD ====================
function renderDashboard() {
  const total = appData.customers.length;
  const counts = { '潛在客戶':0, '已寄開發信':0, '已開發':0, '已詢價':0, '可再開發名單':0, '已成交':0 };
  appData.customers.forEach(c => { if (counts[c.status] !== undefined) counts[c.status]++; });

  let overdue = 0;
  appData.customers.forEach(c => {
    (c.communications || []).forEach(cm => {
      if (cm.needFollowup && cm.nextFollowUpDate && cm.nextFollowUpDate < today()) overdue++;
    });
  });

  let outreachDue = 0;
  appData.customers.forEach(c => {
    if (c.status === '已寄開發信' && c.outreachNext && c.outreachNext <= today()) outreachDue++;
  });

  document.getElementById('statsGrid').innerHTML =
    statCard(total, '客戶總數', '') +
    statCard(counts['潛在客戶'], '潛在客戶', 'potential') +
    statCard(counts['已寄開發信'], '已寄開發信', 'sent') +
    statCard(counts['已開發'], '已開發', 'developed') +
    statCard(counts['已詢價'], '已詢價', 'inquiry') +
    statCard(counts['可再開發名單'], '可再開發名單', 'reopen') +
    statCard(counts['已成交'], '已成交', 'closed') +
    statCard(overdue, '互動逾期跟進', 'followup') +
    statCard(outreachDue, '開發信待追蹤', 'followup');

  renderStatusChart(counts);
  renderIndustryChart();
  renderTrendChart();
  renderConversionChart();
  renderOverdueList();
  renderUpcomingList();
  renderOutreachDue();
}

function statCard(value, label, cls) {
  return '<div class="stat-card ' + cls + '"><div class="stat-value">' + value + '</div><div class="stat-label">' + label + '</div></div>';
}

function renderStatusChart(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  const colors = { '潛在客戶':'#9ca3af','已寄開發信':'#eab308','已開發':'#3b82f6','已詢價':'#f59e0b','可再開發名單':'#8b5cf6','已成交':'#22c55e' };
  let html = '<div style="display:flex;flex-direction:column;gap:8px;width:100%;padding:10px">';
  for (const [status, count] of Object.entries(counts)) {
    const pct = Math.round(count / total * 100);
    html += '<div><div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px"><span>' + status + '</span><span>' + count + ' (' + pct + '%)</span></div>' +
      '<div class="score-bar"><div class="score-bar-fill" style="width:' + pct + '%;background:' + colors[status] + '"></div></div></div>';
  }
  html += '</div>';
  document.getElementById('statusChart').innerHTML = html;
}

function renderIndustryChart() {
  const map = {};
  appData.customers.forEach(c => { const k = c.industry || '未分類'; map[k] = (map[k] || 0) + 1; });
  const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) { document.getElementById('industryChart').innerHTML = '<p style="color:var(--text2);text-align:center;padding:30px">尚無資料</p>'; return; }
  const max = sorted[0][1] || 1;
  const barColors = ['#4f6ef7','#22c55e','#f59e0b','#ef4444','#8b5cf6','#3b82f6','#14b8a6','#f97316','#6366f1','#ec4899'];
  let html = '<div style="display:flex;flex-direction:column;gap:6px;padding:10px">';
  sorted.forEach(([ind, count], i) => {
    const pct = Math.round(count / max * 100);
    html += '<div style="display:flex;align-items:center;gap:10px;font-size:.85rem">' +
      '<span style="min-width:100px;text-align:right">' + ind + '</span>' +
      '<div style="flex:1;height:18px;background:#f0f0f0;border-radius:4px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + barColors[i % barColors.length] + ';border-radius:4px"></div></div>' +
      '<span style="min-width:30px">' + count + '</span></div>';
  });
  html += '</div>';
  document.getElementById('industryChart').innerHTML = html;
}

function renderTrendChart() {
  const el = document.getElementById('trendChart');
  const map = {};
  appData.customers.forEach(c => {
    const d = (c.createdAt || '').slice(0, 7);
    if (!d) return;
    map[d] = (map[d] || 0) + 1;
  });
  const keys = Object.keys(map).sort();
  if (!keys.length) { el.innerHTML = '<p style="color:var(--text2);text-align:center;padding:30px">尚無資料</p>'; return; }
  const max = Math.max(...keys.map(k => map[k]));
  const barColors = ['#4f6ef7','#22c55e','#f59e0b','#ef4444','#8b5cf6','#3b82f6','#14b8a6','#f97316','#6366f1'];
  let html = '<div style="display:flex;flex-direction:column;gap:6px;padding:10px">';
  keys.forEach((k, i) => {
    const pct = Math.round(map[k] / max * 100);
    html += '<div style="display:flex;align-items:center;gap:10px;font-size:.82rem">' +
      '<span style="min-width:90px;text-align:right">' + k + '</span>' +
      '<div style="flex:1;height:18px;background:#f0f0f0;border-radius:4px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + barColors[i % barColors.length] + ';border-radius:4px"></div></div>' +
      '<span style="min-width:26px">' + map[k] + '</span></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderConversionChart() {
  const el = document.getElementById('conversionChart');
  const total = appData.customers.length;
  if (!total) { el.innerHTML = '<p style="color:var(--text2);text-align:center;padding:30px">尚無資料</p>'; return; }
  const steps = ['已寄開發信', '已開發', '已詢價', '已成交'];
  const colors = { '已寄開發信':'#eab308', '已開發':'#3b82f6', '已詢價':'#f59e0b', '已成交':'#22c55e' };
  const stageCount = {};
  appData.customers.forEach(c => { stageCount[c.status] = (stageCount[c.status]||0) + 1; });
  let html = '<div style="display:flex;flex-direction:column;gap:10px;padding:10px">';
  const base = Math.max(total, 1);
  steps.forEach(s => {
    const count = stageCount[s] || 0;
    const pct = Math.round(count / base * 100);
    html += '<div>' +
      '<div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:2px"><span>' + s + '</span><span>' + count + ' 家 (' + pct + '%)</span></div>' +
      '<div class="score-bar"><div class="score-bar-fill" style="width:' + pct + '%;background:' + colors[s] + '"></div></div></div>';
  });
  html += '<div style="font-size:.82rem;color:var(--text2);margin-top:6px;padding-top:8px;border-top:1px dashed var(--border)">已寄開發信至已成交率：' +
    (stageCount['已成交']||0) + ' / ' + (stageCount['已寄開發信']||0) + ' = ' + (stageCount['已寄開發信'] ? Math.round((stageCount['已成交']||0)/stageCount['已寄開發信']*100) : 0) + '%' +
    '</div></div>';
  el.innerHTML = html;
}

function renderOverdueList() {
  const ct = document.getElementById('overdueList');
  let items = [];
  appData.customers.forEach(c => {
    (c.communications || []).forEach(cm => {
      if (cm.needFollowup && cm.nextFollowUpDate && cm.nextFollowUpDate < today()) {
        items.push({ customer: c, comm: cm, days: Math.abs(daysBetween(today(), cm.nextFollowUpDate)) });
      }
    });
  });
  items.sort((a, b) => b.days - a.days);
  if (!items.length) { ct.innerHTML = '<p style="color:var(--text2);padding:10px">所有跟進都已按時完成</p>'; return; }
  ct.innerHTML = items.slice(0, 5).map(item =>
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);cursor:pointer" onclick="openDetail(\'' + item.customer.id + '\')">' +
    '<div><strong>' + esc(displayName(item.customer)) + '</strong> — ' + esc(item.comm.subject) + '</div>' +
    '<span class="followup-overdue">逾期 ' + item.days + ' 天</span></div>'
  ).join('');
}

function renderUpcomingList() {
  const ct = document.getElementById('upcomingList');
  const weekLater = new Date(); weekLater.setDate(weekLater.getDate() + 7);
  const weekLaterStr = weekLater.toISOString().slice(0, 10);
  let items = [];
  appData.customers.forEach(c => {
    (c.communications || []).forEach(cm => {
      if (cm.needFollowup && cm.nextFollowUpDate && cm.nextFollowUpDate >= today() && cm.nextFollowUpDate <= weekLaterStr) {
        items.push({ customer: c, comm: cm, days: daysBetween(today(), cm.nextFollowUpDate) });
      }
    });
  });
  items.sort((a, b) => a.days - b.days);
  if (!items.length) { ct.innerHTML = '<p style="color:var(--text2);padding:10px">本週無待跟進項目</p>'; return; }
  ct.innerHTML = items.slice(0, 5).map(item =>
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);cursor:pointer" onclick="openDetail(\'' + item.customer.id + '\')">' +
    '<div><strong>' + esc(displayName(item.customer)) + '</strong> — ' + esc(item.comm.subject) + '</div>' +
    '<span class="followup-soon">' + item.days + ' 天後</span></div>'
  ).join('');
}

function renderOutreachDue() {
  const el = document.getElementById('outreachDueList');
  if (!el) return;
  const todayStr = today();
  let items = appData.customers.filter(c => c.status === '已寄開發信' && c.outreachNext && c.outreachNext <= todayStr)
    .map(c => ({ customer: c, days: Math.abs(daysBetween(todayStr, c.outreachNext)) }))
    .sort((a, b) => b.days - a.days);
  if (!items.length) { el.innerHTML = '<p style="color:var(--text2);padding:10px">所有開發信都已按時追蹤</p>'; return; }
  el.innerHTML = items.slice(0, 6).map(item =>
    '<div style="padding:10px;border-bottom:1px solid var(--border)">' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<div style="cursor:pointer" onclick="openDetail(\'' + item.customer.id + '\')"><strong>' + esc(displayName(item.customer)) + '</strong> — 開發信寄送 ' + esc(item.customer.outreachDate || '') + '</div>' +
    '<span class="followup-overdue">逾期 ' + item.days + ' 天</span></div>' +
    '<div class="sentence-actions">' +
    '<button class="btn btn-sm btn-primary" onclick="markOutreachFollowed(\'' + item.customer.id + '\')">✅ 已追蹤，設下個月</button>' +
    '<button class="btn btn-sm btn-outline" onclick="markOutreachConverted(\'' + item.customer.id + '\')">➡️ 已轉為已開發</button>' +
    '</div></div>'
  ).join('');
}

function markOutreachFollowed(id) {
  const c = appData.customers.find(x => x.id === id);
  if (!c) return;
  const d = new Date(); d.setDate(d.getDate() + 30);
  c.outreachDate = today();
  c.outreachNext = d.toISOString().slice(0, 10);
  c.updatedAt = new Date().toISOString();
  saveData(appData);
  renderOutreachDue();
  renderDashboard();
  if (currentDetailId) openDetail(currentDetailId);
}

function markOutreachConverted(id) {
  const c = appData.customers.find(x => x.id === id);
  if (!c) return;
  if (!confirm('將此客戶狀態改為「已開發」並停止開發信追蹤提醒？')) return;
  if (!c.statusHistory) c.statusHistory = [];
  c.statusHistory.push({ from: c.status, to: '已開發', at: today(), note: '開發信後轉開發' });
  c.status = '已開發';
  c.outreachNext = null;
  c.outreachDate = c.outreachDate || today();
  c.updatedAt = new Date().toISOString();
  saveData(appData);
  renderOutreachDue();
  renderDashboard();
  filterCustomers();
  if (currentDetailId) openDetail(currentDetailId);
}

// ==================== EXPORT / IMPORT (CSV) ====================
function csvEscape(v) {
  if (v === null || v === undefined) return '';
  v = String(v);
  if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function arrayToPipe(arr) { return (arr || []).map(x => csvEscape(x)).join(';'); }

function exportData() {
  const headers = ['公司名稱','品牌名稱','聯絡人','Email','電話','地址','產業別','客戶來源','狀態','優先級','開發信寄送日期','下次追蹤日期','產品興趣','MOQ','價格敏感度','預算區間','所需認證','交期期待','痛點/顧慮','訂單週期','決策者姓名','決策者職稱','決策者影響力','備註','互動紀錄(JSON)','樣品紀錄(JSON)','競品資訊(JSON)','報價跟進分類','建立時間'];
  const rows = appData.customers.map(c => [
    c.companyName, c.brand || '', c.contactPerson, c.email, c.phone, c.address, c.industry, c.source, c.status,
    {1:'高',2:'中',3:'低'}[c.priority] || '',
    c.outreachDate || '', c.outreachNext || '',
    arrayToPipe(c.productsOfInterest), c.moq, c.pricingSensitivity, c.budgetRange,
    arrayToPipe(c.certifications), c.deliveryTimeline, arrayToPipe(c.painPoints), c.orderCycle,
    c.decisionMaker?.name, c.decisionMaker?.title, c.decisionMaker?.influence,
    c.notes,
    c.communications ? JSON.stringify(c.communications) : '',
    c.samples ? JSON.stringify(c.samples) : '',
    c.competitors ? JSON.stringify(c.competitors) : '',
    c.quoteType || '',
    c.createdAt
  ]);
  const csv = [headers.map(csvEscape).join(','), ...rows.map(r => r.map(csvEscape).join(','))].join('\r\n');
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '冬瓜茶客戶追蹤_' + today() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function parseCsvLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { result.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      let text = ev.target.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const lines = text.split(/\r\n|\r|\n/).filter(l => l.trim() !== '');
      if (lines.length < 2) throw new Error('無資料');
      const headers = parseCsvLine(lines[0]);
      if (headers[0] !== '公司名稱') throw new Error('請選擇正確的 CSV 檔案');
      const newCustomers = [];
      for (let i = 1; i < lines.length; i++) {
        const vals = parseCsvLine(lines[i]);
        const g = (h) => { const idx = headers.indexOf(h); return (idx >= 0 && vals[idx]) ? vals[idx].trim() : ''; };
        const splitArr = (s) => s ? s.split(';').map(x => x.replace(/^"(.*)"$/,'$1')).filter(Boolean) : [];
        const priorityMap = { '高':'1', '中':'2', '低':'3' };
        const now = new Date().toISOString();
        newCustomers.push({
          id: uuid(),
          companyName: g('公司名稱'),
          brand: g('品牌名稱'),
          contactPerson: g('聯絡人'),
          email: g('Email'),
          phone: g('電話'),
          address: g('地址'),
          industry: g('產業別'),
          source: g('客戶來源'),
          status: g('狀態') || '潛在客戶',
          priority: priorityMap[g('優先級')] || '2',
          outreachDate: g('開發信寄送日期') || '',
          outreachNext: g('下次追蹤日期') || '',
          productsOfInterest: splitArr(g('產品興趣')),
          moq: g('MOQ'),
          pricingSensitivity: g('價格敏感度'),
          budgetRange: g('預算區間'),
          certifications: splitArr(g('所需認證')),
          deliveryTimeline: g('交期期待'),
          painPoints: splitArr(g('痛點/顧慮')),
          orderCycle: g('訂單週期'),
          decisionMaker: { name: g('決策者姓名'), title: g('決策者職稱'), influence: g('決策者影響力') },
          notes: g('備註'),
          communications: safeParseJson(g('互動紀錄(JSON)'), []),
          samples: safeParseJson(g('樣品紀錄(JSON)'), []),
          competitors: safeParseJson(g('競品資訊(JSON)'), []),
          quoteType: g('報價跟進分類'),
          statusHistory: [{ from: '匯入', to: g('狀態') || '潛在客戶', at: today(), note: '' }],
          score: calcScore(priorityMap[g('優先級')] || '2'),
          createdAt: g('建立時間') || now, updatedAt: now,
        });
      }
      if (!confirm('匯入將覆蓋目前所有資料（共 ' + newCustomers.length + ' 筆客戶），確定繼續？')) return;
      appData = getDefaultData();
      appData.customers = newCustomers;
      saveData(appData);
      alert('匯入成功！共 ' + newCustomers.length + ' 筆客戶');
      renderDashboard();
      filterCustomers();
    } catch (err) { alert('匯入失敗：' + (err && err.message ? err.message : '無法辨識的 CSV 格式')); }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function safeParseJson(s, fallback) {
  if (!s) return fallback;
  try { const v = JSON.parse(s); return Array.isArray(v) ? v : fallback; } catch { return fallback; }
}

// ==================== BACKUP REMINDER ====================
function checkBackupReminder() {
  const lastDismiss = localStorage.getItem(BACKUP_KEY);
  const threshold = 50;
  const showEveryMs = 7 * 24 * 60 * 60 * 1000;
  const showByCount = appData.customers.length >= threshold;
  const showByTime = !lastDismiss || (Date.now() - parseInt(lastDismiss || 0) > showEveryMs);
  if ((showByCount || appData.customers.length > 0) && showByTime) {
    document.getElementById('backupBar').classList.remove('hidden');
  }
}

function dismissBackup() {
  localStorage.setItem(BACKUP_KEY, Date.now().toString());
  document.getElementById('backupBar').classList.add('hidden');
}

// ==================== UTILS ====================
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function displayName(c) { return c ? (c.brand || c.companyName || '') : ''; }

// ==================== INIT ====================
renderDashboard();
checkBackupReminder();
updateCloudUI('local');

if (cloudEnabled()) {
  // 開啟時自動同步一次
  setTimeout(() => syncFromCloud(), 300);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown')) closeAddDropdowns();

document.addEventListener('keydown', e => {
